# Publica una release de GitHub al subir una etiqueta vX.Y.Z.
# La etiqueta debe coincidir con la versión de plugin.json y tener su sección en CHANGELOG.md.
name: release

on:
  push:
    tags: ["v*.*.*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - name: Comprobar versión y CHANGELOG
        run: bash scripts/check-version.sh "$GITHUB_REF_NAME"
      - name: Crear release con las notas del CHANGELOG
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          bash scripts/check-version.sh --notes > notes.md
          gh release create "$GITHUB_REF_NAME" --title "$GITHUB_REF_NAME" --notes-file notes.md --verify-tag
